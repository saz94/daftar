name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Fetch the typeface
        run: bash ci/fetch_fonts.sh
      - name: Build the app
        shell: bash
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Publish the build log to the "ci-logs" branch if the build failed
        if: failure()
        run: |
          mkdir /tmp/log && cd /tmp/log
          { grep -E "^(e|w): |error:|FAILED|What went wrong" -A3 "$GITHUB_WORKSPACE/build.log" | head -300; echo "-----"; tail -80 "$GITHUB_WORKSPACE/build.log"; } > build.txt || true
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "Build log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
      - uses: actions/upload-artifact@v4
        with:
          name: Daftar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Run the tax and invoice-reading tests
        run: ./gradlew testDebugUnitTest

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Daftar-debug-apk
          path: app/build/outputs/apk/debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Photograph the screens on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: bash ci/screens.sh
      - name: Publish the screenshots to the "screenshots" branch
        run: |
          mkdir /tmp/pub && cp shots/* /tmp/pub/
          cd /tmp/pub
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots

  adaptive:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the runner's SDK has no Pixel Fold profile; the 7.6" Foldable is the same book-style
          # device (2208 x 1840 inner panel, cover screen), the 6.7" Foldable is a flip
          - { tag: fold-7-6, profile: "7.6in Foldable", foldable: 1, tabletop_rot: 1 }
          - { tag: flip-6-7, profile: "6.7in Foldable", foldable: 1, tabletop_rot: 0 }
          - { tag: tablet-7, profile: "7in WSVGA (Tablet)", foldable: 0, tabletop_rot: 1 }
          - { tag: tablet-10, profile: "10.1in WXGA (Tablet)", foldable: 0, tabletop_rot: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Daftar-debug-apk
          path: app/build/outputs/apk/debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record which device profiles this runner has
        run: |
          mkdir -p shots-${{ matrix.tag }}
          { echo "emulator:"; $ANDROID_HOME/emulator/emulator -version 2>/dev/null | head -2; echo; echo "devices:"; $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list device -c 2>/dev/null; } > shots-${{ matrix.tag }}/runner.txt || true
          cat shots-${{ matrix.tag }}/runner.txt
      - name: Photograph the cover and inner experiences (${{ matrix.tag }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          emulator-boot-timeout: 900
          pre-emulator-launch-script: bash ci/avd_hinge.sh "${{ matrix.profile }}"
          disable-animations: false
          script: bash ci/screens_adaptive.sh ${{ matrix.tag }} ${{ matrix.foldable }} ${{ matrix.tabletop_rot }} 2>&1 | tee shots-${{ matrix.tag }}/run.txt
      - name: Publish to the "screenshots-${{ matrix.tag }}" branch
        if: always()
        run: |
          mkdir /tmp/pub && cp shots-${{ matrix.tag }}/* /tmp/pub/ || true
          cd /tmp/pub
          git init -q -b screenshots-${{ matrix.tag }}
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "Screenshots (${{ matrix.tag }}) for ${GITHUB_SHA}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots-${{ matrix.tag }}
