name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Fetch the typeface
        run: bash ci/fetch_fonts.sh
      - name: Build the app
        shell: bash
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Publish the build log to the "ci-logs" branch if the build failed
        if: failure()
        run: |
          mkdir /tmp/log && cd /tmp/log
          { grep -E "^(e|w): |error:|FAILED|What went wrong" -A3 "$GITHUB_WORKSPACE/build.log" | head -300; echo "-----"; tail -80 "$GITHUB_WORKSPACE/build.log"; } > build.txt || true
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "Build log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
      - uses: actions/upload-artifact@v4
        with:
          name: Daftar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Run the tax and invoice-reading tests
        run: ./gradlew testDebugUnitTest

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Daftar-debug-apk
          path: app/build/outputs/apk/debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Photograph the screens on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: bash ci/screens.sh
      - name: Publish the screenshots to the "screenshots" branch
        run: |
          mkdir /tmp/pub && cp shots/* /tmp/pub/
          cd /tmp/pub
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
